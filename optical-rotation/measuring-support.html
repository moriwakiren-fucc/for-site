<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap');
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}
p {
  font-size: 22.5px;
  font-family: Noto Sans JP;
  margin: 0;
}
#urlInput {
  background-color: #FFFFFF;
  height: 30px;
  width: 130px;
  font-size: 25px;
  border: 2px solid #AAAAAA;
  border-radius: 15px;
  padding-left: 20px;
}
#iframe-container {
  width: 100%;
  height: calc(100% - 50px);
  overflow: hidden;
  margin-top: 10px;
  position: relative;
  display: flex;              /* 中央寄せのため */
  justify-content: flex-start;    /* 横方向中央 */
  align-items: self-start;        /* 縦方向中央 */
}
#my-iframe {
  border: none;
  transform-origin: top left; /* 拡大縮小の基準を左上にしておく */
  display: block;
}
</style>
</head>
<body>

<p><b>シート名：</b><input type="text" id="urlInput" placeholder="シート名を入力！" value="temp"></p>

<div id="iframe-container">
  <iframe id="my-iframe"></iframe>
</div>

<script>

  function changeIframeUrl() {
    const inputUrl = document.getElementById('urlInput').value;
    const iframe = document.getElementById('my-iframe');

    let newUrl = "https://oitast-my.sharepoint.com/personal/ough240080_st_oita-ed_jp/_layouts/15/Doc.aspx?sourcedoc={156ea14c-ef1a-460f-a9b2-f5de026c3b68}&action=embedview&wdAllowInteractivity=False&AllowTyping=True&Item='" 
                 + inputUrl + "'!P2%3AW14&wdDownloadButton=True&wdInConfigurator=True&wdInConfigurator=True&wdAllowInteractivity=False&wdRefreshOnOpen=True";

    iframe.src = newUrl;
  }

  // 入力が変わった瞬間にiframe更新
  document.getElementById('urlInput').addEventListener('input', changeIframeUrl);

  
  setInterval(() => {
    const iframe = document.getElementById("my-iframe");
    iframe.src = iframe.src;  // 再読み込み
  }, 3000); // 30秒ごとに更新

  // ページ読み込み時に初期値を反映
  window.onload = () => {
    changeIframeUrl();
    resizeIframe();
  };

  // 画面サイズに応じてiframeを拡大縮小
  function resizeIframe() {
    const container = document.getElementById('iframe-container');
    const iframe = document.getElementById('my-iframe');

    const baseWidth = 581;   // 基準幅
    const baseHeight = 277;  // 基準高さ

    const scaleX = container.clientWidth / baseWidth;
    const scaleY = container.clientHeight / baseHeight;

    const scale = Math.min(scaleX, scaleY);

    iframe.style.width = baseWidth + "px";
    iframe.style.height = baseHeight + "px";
    iframe.style.transform = `scale(${scale})`;

    // 中央寄せのために余白を調整
    iframe.style.marginLeft = ((container.clientWidth - baseWidth * scale) / 2) + "px";
    iframe.style.marginTop = ((container.clientHeight - baseHeight * scale) / 2) + "px";
  }

  window.addEventListener('resize', resizeIframe);
</script>

</body>
</html>
