<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>結果報告</title>
  <meta name=”description” content=”＊＊第69回日本学生科学賞　HC026CE_大分県立大分上野丘高等学校_化学部　審査結果のご報告＊＊” />
  <style>
    section {
      margin-left: 5vw;
      width: 90vw;
    }
    details summary {
      font-size: 5em;
    }
    details img {
      border: 2px solid #000000;
      display: none;
      width: 90vw;
    }
  </style>
</head>
<body>
  <section>
    <details>
      <summary>結果報告</summary>
      <img id="awardImage">
    </details>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const award = params.get("award");

    if (award) {
      const img = document.getElementById("awardImage");
      img.src = `imgs/${award}.jpeg`;
      img.style.display = "block";
    }
  </script>

</body>
</html>
